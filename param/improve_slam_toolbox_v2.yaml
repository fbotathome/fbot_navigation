slam_toolbox:
  ros__parameters:
    # ------------------------------------------------------------------
    # Solver (only used when loop closure adds constraints to the graph)
    # ------------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI        # ignored by direct solvers, kept for reference
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss            # robust to outliers (people walking around)
    ceres_huber_delta: 1.0  # Huber loss parameter for outlier rejection

    # ------------------------------------------------------------------
    # Frames / topics / mode
    # ------------------------------------------------------------------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    enable_interactive_mode: false
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000               # slam_toolbox default; 20M can crash on big maps

    # ------------------------------------------------------------------
    # Update rates -- the main cause of "pose + scan freeze".
    # Rebuilding the occupancy grid every 0.2 s and matching ~every scan
    # starves the node and the CPU; keep these relaxed.
    # ------------------------------------------------------------------
    resolution: 0.05
    map_update_interval: 1.0                  # was 0.2 (default 5.0); raise to 2.0 if it still stalls
    throttle_scans: 1
    minimum_time_interval: 0.2                # was 0.10 (max ~5 Hz of scan matching)
    minimum_travel_distance: 0.1              # was 0.03 (matched on 3 cm of motion)
    minimum_travel_heading: 0.1               # was 0.03 (~6 deg)
    transform_publish_period: 0.02            # map->odom at 50 Hz; cheap, keeps TF smooth

    # ------------------------------------------------------------------
    # Laser limits (adjust max range to the Hokuyo model / arena size)
    # ------------------------------------------------------------------
    min_laser_range: 0.3
    max_laser_range: 15.0                     # was 25; long rays cost raytracing time

    # ------------------------------------------------------------------
    # Scan matching
    # ------------------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10                      # was 50 (default 10); each scan is linked against this history
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.2
    link_scan_maximum_distance: 1.5           # was 2.5 (default 1.5)
    use_response_expansion: true

    # correlation_search_space_dimension: 0.5
    # correlation_search_space_resolution: 0.02 # was 0.01; ~4x cheaper correlation grid
    # correlation_search_space_smear_deviation: 0.1

    coarse_search_angle_offset: 0.174
    coarse_angle_resolution: 0.052
    fine_search_angle_offset: 0.0087

    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.8
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.4

    # ------------------------------------------------------------------
    # Loop closure. Needed so drift is corrected while driving around the
    # arena (README tip). Strict thresholds avoid false closures.
    # If you see short pauses exactly when a loop closes, set to false and
    # test again to separate the two effects.
    # ------------------------------------------------------------------
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.6
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ------------------------------------------------------------------
    # Map cleanliness (reject people / transient obstacles)
    # ------------------------------------------------------------------
    min_pass_through: 4
    occupancy_threshold: 0.3
