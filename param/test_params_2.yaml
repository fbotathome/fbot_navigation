amcl:
  ros__parameters:
    alpha1: 0.2   # Expected noise in odometry rotation from rotational movement
    alpha2: 0.2   # Expected noise in odometry rotation from translational movement
    alpha3: 0.2   # Expected noise in odometry translation from translational movement
    alpha4: 0.2   # Expected noise in odometry translation from rotational movement

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_footprint"   # The robot's base frame
    global_frame_id: "map"            # The frame tied to the static map
    odom_frame_id: "odom"             # The frame published by the wheel odometry/EK
    scan_topic: /scan                 # The topic AMCL subscribes to for localization
    set_initial_pose: False           # Determines whether the operator need to manually set the starting pose
    use_sim_time: False

    laser_model_type: "likelihood_field"
    laser_max_range: 25.0     # Maximum range (m) of the laser sensor, calculated in meters
    laser_min_range: -1.0     # Minimum range (m) of the laser sensor, -1 means to use the sensor's reported minimum
    laser_likelihood_max_dist: 2.0  # Maximum distance (m) to inflate obstacles in the likelihood field map
    max_beams: 60             # Number of evenly spaced beams used for AMCL updates
    max_particles: 10000      # Maximum number of particles to use in the filter
    min_particles: 1000       # Minimum number of particles to use in the filter
    resample_interval: 1      # Resample particles every Nth laser update
    save_pose_rate: 0.5       # How often (Hz) to save the estimated pose to disk

    update_min_d: 0.05    # Minimum translational (m) movement required to trigger an update
    update_min_a: 0.05    # Minimum rotational (rad) movement required to trigger an update

    beam_skip_distance: 0.5         # Distance (m) to ignore a beam if it's considered faulty
    beam_skip_error_threshold: 0.9  # Percentage of beams required to trigger a skip
    beam_skip_threshold: 0.3        # Ratio of valid beams required to not skip
    do_beamskip: false              # If true, helps ignore dynamic obstacles in AMCL, but can cause instability if the map is outdated

    tf_broadcast: true        # AMCL will publish the map -> odom transform
    transform_tolerance: 1.0  # Time (s) to wait for a transform to become available before giving up

    z_hit: 0.5      # Mixture weight for actual obstacle hits
    z_rand: 0.5     # Mixture weight for random noise
    z_max: 0.05     # Mixture weight for max range readings (free space)
    z_short: 0.05   # Mixture weight for short readings (dynamic obstacles)

    sigma_hit: 0.2              # Standard deviation (m) for the Gaussian model of laser hits
    # lambda_short: 0.1           # Exponential decay parameter for short readings
    # recovery_alpha_slow: 0.001  # Exponential decay rate for the slow average weight filter
    # recovery_alpha_fast: 0.1    # Exponential decay rate for the fast average weight filter

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    controller_frequency: 10.0      # The frequency (Hz) at which the controller operates
    failure_tolerance: 0.3          # Time (s) allowed to fail computing a path before aborting
    use_sim_time: False
    
    min_x_velocity_threshold: 0.01        # Minimum translational velocity (m/s) to be considered moving
    min_theta_velocity_threshold: 0.01    # Minimum rotational velocity (rad/s) to be considered moving
    min_y_velocity_threshold: 1.0         # Minimum lateral velocity (m/s) to be considered moving

    # min_stopped_velocity_threshold: 0.01          # Minimum velocity (m/s) to be considered stopped
    # min_stopped_angular_velocity_threshold: 0.01  # Minimum angular velocity (rad/s) to be considered stopped
    # min_stopped_time: 2.0                         # Minimum time (s) to be considered stopped

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5   # Minimum distance (m) the robot must have moved to be considered making progress
      movement_time_allowance: 10.0   # Time (s) allowed to fail making progress before triggering recovery behavior
    
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True            # When the robot is within xy goal tolerance, it will only reach the goal if it meets the yaw tolerance
      xy_goal_tolerance: 0.3    # Distance (m) from the goal position at which the goal is considered reached 
      yaw_goal_tolerance: 0.3   # Angle (rad) from the goal orientation at which the goal is considered reached

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True  # Publishes information about the evaluated trajectories for debugging
      # publish_cost_grid_pc: True      # Visualizes the critic scoring grid in RViz
      # rune_plan: True                 # Continuously crops old waypoints behind the robot to save CPU

      min_vel_x: 0.0        # Minimum translational velocity (m/s)
      min_vel_y: 0.0        # Minimum lateral velocity (m/s)
      # min_vel_theta: 0.0    # Minimum rotational velocity (rad/s)
      max_vel_x: 1.0        # Maximum translational velocity (m/s)
      max_vel_theta: 1.0    # Maximum rotational velocity (rad/s)
      max_vel_y: 0.0        # Maximum lateral velocity (m/s)

      min_speed_xy: -0.2    # Absolute minimum translational speed (m/s)
      max_speed_xy: 1.0     # Absolute maximum translational speed (m/s)
      min_speed_theta: 0.2  # Absolute minimum rotational speed (rad/s)
      # max_speed_theta: 1.0  # Absolute maximum rotational speed (rad/s)

      acc_lim_x: 1.5        # Maximum translational acceleration (m/s^2)
      acc_lim_y: 0.0        # Maximum lateral acceleration (m/s^2)
      acc_lim_theta: 1.5    # Maximum rotational acceleration (rad/s^2)
      decel_lim_x: -1.5     # Maximum translational deceleration (m/s^2)
      decel_lim_y: 0.0      # Maximum lateral deceleration (m/s^2)
      decel_lim_theta: -1.5 # Maximum rotational deceleration (rad/s^2)

      vx_samples: 20        # Number of linear velocity samples to generate in the x direction
      vy_samples: 0         # Number of linear velocity samples to generate in the y direction
      vtheta_samples: 40    # Number of angular velocity samples to generate

      trans_stopped_velocity: 0.25  # Minimum translational velocity (m/s) to be considered stopped
      # rot_stopped_velocity: 0.25    # Minimum rotational velocity (rad/s) to be considered stopped

      sim_time: 2.0                               # Time (s) to forward simulate each trajectory for
      linear_granularity: 0.05                    # Minimum distance (m) between points in the simulated trajectories
      angular_granularity: 0.025                  # Minimum angle (rad) between points in the simulated trajectories
      short_circuit_trajectory_evaluation: True   # Stops evaluating remaining simulated trajectories once the highest possible score is found
  
      transform_tolerance: 0.2      # Time (s) to wait for a transform to become available before giving up
      stateful: True                # When the robot is within xy goal tolerance, it will only reach the goal if it meets the yaw tolerance
      xy_goal_tolerance: 0.3        # Distance (m) from the path alignment

      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprintCritic", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critics: ["ObstacleFootprintCritic", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForwardCritic", "Twirling", "RotateToGoal", "Oscillation"]

      BaseObstacle.scale: 0.02        # Scaling factor for the base obstacle cost
      GoalAlign.scale: 18.0           # Scaling factor for the goal alignment cost
      PathAlign.scale: 32.0           # Scaling factor for the path alignment cost
      PathDist.scale: 32.0            # Scaling factor for the path distance cost
      GoalDist.scale: 24.0            # Scaling factor for the goal distance cost
      RotateToGoal.scale: 18.0        # Scaling factor for the rotation to goal cost

      PathAlign.forward_point_distance: 0.1   # Distance (m) from the robot's center to the forward point used for calculating path alignment
      GoalAlign.forward_point_distance: 0.1   # Distance (m) from the robot's center to the forward point used for calculating goal alignment

      RotateToGoal.slowing_factor: 5.0    # Scaling factor for how much to slow down the robot as it approaches the goal
      RotateToGoal.lookahead_time: -1.0   # Time (s) to look ahead on the trajectory to find the point used for calculating the angle to the goal

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0      # The expected frequency (Hz) at which the planner will produce new plans
    use_sim_time: False

    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5                      # Tolerance (m) on the goal point
      allow_unknown: True                 # Allow path to travel through unknown space
      max_iterations: 1000000             # Maximum iterations before giving up
      max_on_approach_iterations: 1000    # Iterations for the analytic expansion to the goal
      max_planning_time: 2.0              # Maximum time (s) to find a path before aborting
      
      downsample_costmap: False           # Downsamples the global costmap for faster planning
      downsampling_factor: 1              # Reduce costmap resolution during planning
 
      minimum_turning_radius: 0.4         # Minimum turning radius (m)
      reverse_penalty: 3.0                # Multiplier to penalize driving in reverse
      change_penalty: 0.05                # Penalty for changing direction (forward <-> reverse)
      non_straight_penalty: 2.0           # Penalty for turning
      cost_penalty: 1.5                   # How strictly to avoid high-cost (inflated) obstacle areas
      
      angle_quantization: 72              # Number of angular bins (72 = 5-degree increments).
      analytic_expansion_ratio: 3.5       # How often to try calculating the exact Bezier curve to the goal
      analytic_expansion_max_length: 3.0  # Max distance (m) to attempt the final analytic curve

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0     # The frequency (Hz) at which the costmap updates
      publish_frequency: 1.0    # The frequency (Hz) at which the costmap is published, usually for visualization in RViz
      # transform_tolerance: 0.4  # Time (s) to wait for a transform to become available before giving up

      global_frame: map                   # The frame in which the costmap will publish its data
      robot_base_frame: base_footprint    # The frame of the robot's base, used for calculating the costmap's origin
      static_map: True                    # Whether to subscribe to the static map topic
      rolling_window: False               # Whether the costmap should be a rolling window around the robot or a fixed size in the global frame 
      track_unknown_space: True           # Allows planners to path through unexplored areas if necessary
      always_send_full_costmap: True      # Whether to publish the full costmap or just the updated cells at each update cycle
      # use_sim_time: False

      footprint: "[[0.48, 0.0], [0.47, 0.05], [0.45, 0.11], [0.40, 0.19], [0.34, 0.23], [0.29, 0.26], [0.22, 0.26], [0.14, 0.26], [0.0, 0.26], [-0.14, 0.26], [-0.22, 0.26], [-0.34, 0.26], [-0.39, 0.23], [-0.45, 0.19], [-0.49, 0.11], [-0.51, 0.05], [-0.52, 0.0], [-0.51, -0.05], [-0.49, -0.11],  [-0.45, -0.19], [-0.39, -0.23], [-0.29, -0.26], [-0.22, -0.26], [-0.14, -0.26], [0.0, -0.27], [0.14, -0.27], [0.22, -0.27], [0.29, -0.26], [0.34, -0.23], [0.40, -0.19], [0.45, -0.11], [0.47, -0.05]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True   # Subscribes to the map topic with transient local durability

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # combination_method: 1         # Method for combining obstacle data: 0 = overwrite, 1 = max, 2 = sum
        observation_sources: scan scan2 scan3
        scan:
          topic: /scan
          max_obstacle_height: 2.0    # Maximum height (m) of obstacles to consider
          clearing: True              # Whether to clear obstacles from the costmap when they are no longer detected
          marking: True               # Whether to mark obstacles on the costmap when they are detected
          data_type: "LaserScan"
          raytrace_max_range: 3.0     # Clears free space up to 3m
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5     # Marks obstacles up to 2.5m
          obstacle_min_range: 0.0
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0    # Maximum height (m) of obstacles to consider
          clearing: True              # Whether to clear obstacles from the costmap when they are no longer detected
          marking: True               # Whether to mark obstacles on the costmap when they are detected
          data_type: "LaserScan"
          # raytrace_max_range: 1.5     # Clears free space up to 1.5m
          # raytrace_min_range: 0.0
          # obstacle_max_range: 1.0     # Marks obstacles up to 1m
          # obstacle_min_range: 0.0
        scan3:
          topic: /scan3
          max_obstacle_height: 2.0    # Maximum height (m) of obstacles to consider
          clearing: True              # Whether to clear obstacles from the costmap when they are no longer detected
          marking: True               # Whether to mark obstacles on the costmap when they are detected
          data_type: "LaserScan"
          #raytrace_max_range: 1.5     # Clears free space up to 1.5m
          #raytrace_min_range: 0.0
          #obstacle_max_range: 1.0     # Marks obstacles up to 1m
          #obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0     # Scaling factor for how quickly costs fall off with distance from an obstacle
        inflation_radius: 2.0         # Maximum distance to inflate costs from an obstacle

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 2.0

