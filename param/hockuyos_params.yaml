          clearing: True              # Whether to clear obstacles from the costmap when they are no longer detected
          marking: True               # Whether to mark obstacles on the costmap when they are detected
          data_type: "LaserScan"
          # raytrace_max_range: 1.5     # Clears free space up to 1.5m
